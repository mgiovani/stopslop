[package]
name = "stopslop"
version = "0.5.0"
edition = "2021"
description = "Like Ruff, but for AI slop — deterministic AI-slop linter for TS/Python/Go/Rust."
license = "MIT"
repository = "https://github.com/mgiovani/stopslop"
keywords = ["linter", "ai", "cli", "lint", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
# 2.7 MB of README art that the README now links by absolute URL anyway.
exclude = ["assets/*"]

[dependencies]
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
ignore = "0.4"
globset = "0.4"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
