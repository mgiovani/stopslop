name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Dogfood (Tier A fails the build, Tier B prints as warnings)
        id: dogfood
        run: |
          cargo run --quiet -- . --format sarif > "$RUNNER_TEMP/stopslop.sarif" || true
          cargo run --quiet -- .
      - name: Annotate the PR with the findings
        if: steps.dogfood.outcome == 'success' || steps.dogfood.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/stopslop.sarif
          category: stopslop
