name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Stress (wall-clock guards on generated 8-20 MB inputs)
        run: cargo test --release --test stress -- --ignored --test-threads=1
      - name: Render the findings report
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          cargo run --quiet -- . --format markdown > "$RUNNER_TEMP/report/findings.md" || true
      - name: Upload the findings report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stopslop-report
          path: ${{ runner.temp }}/report/
          retention-days: 1
      - name: Dogfood (Tier A fails the build, Tier B prints as warnings)
        id: dogfood
        run: |
          cargo run --quiet -- . --format sarif > "$RUNNER_TEMP/stopslop.sarif" || true
          cargo run --quiet -- .
      - name: Annotate the PR with the findings
        if: steps.dogfood.outcome == 'success' || steps.dogfood.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/stopslop.sarif
          category: stopslop
