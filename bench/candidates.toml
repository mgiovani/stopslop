what_it_missed = "A broad except whose body logs through a method call and never re-raises"
evidence = "self.log_error(...) and self.logger.exception(...) bodies; also print(...) followed by return -1"
fix_idea = "Match the call's last attribute segment against print/log/debug/info/warning/error/exception/critical, and let a trailing return of a literal count as swallowing"

[[miss]]
rule = "SLOP005"
what_it_missed = "A TypeScript catch that logs and returns a null sentinel"
evidence = "console.error(...) followed by return null in the same catch block"
fix_idea = "Accept one trailing return of null/undefined/false/[]/{} alongside the console call; measure on the pinned TypeScript cells first, the defensive-parse idiom is real"

[[miss]]
rule = "SLOP001"
what_it_missed = "Elision phrased and so forth or etc. instead of the panel's words"
evidence = "An ellipsis comment reading and so forth for each dataset"
fix_idea = "Add and so (forth|on) and etc. behind the same ellipsis prefix"

[[miss]]
rule = "SLOP013"
what_it_missed = "A single-word lowercase bracket marker echoed from the source pipeline"
evidence = "A bracketed substeps token at the head of two AI prose files"
fix_idea = "Add the word to the keyword list, or accept a bracket around one short lowercase word; weigh it against how corpus-specific the token is"

[[miss]]
rule = "SLOP009"
what_it_missed = "Lowercase kebab and dotted placeholder strings"
evidence = "Server-address, password and token literals written as your-something in AI Python files"
fix_idea = "Add a your[-.] prefix alternative to RE_CI, scoped to string literals as the rule already is"

[[miss]]
rule = "SLOP042"
what_it_missed = "Module-scope narration over a call assignment in Python"
evidence = "A create-a-dataframe comment over a pandas constructor call; the same pair inside a function body does fire"
fix_idea = "Exempt only when the right-hand side holds no call node, which is what the README's module and class attributes wording already promises"

[[miss]]
rule = "SLOP042"
what_it_missed = "A doc-comment block before a plain statement inside a TypeScript function body"
evidence = "An initialize-an-empty-string doc comment over a let binding"
fix_idea = "Apply the doc-comment exemption only when the anchor is a declaration, not an expression or return statement inside a body"
