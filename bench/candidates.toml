# Measured hypotheses, not rules.
#
# Every candidate here is a tell somebody proposed after reading AI files no rule flagged.
# bench/analyze_corpus.py compiles the regex, runs it over every materialized cell in the
# scope the entry names, and prints the human and AI hit rates side by side. A candidate that
# separates the splits earns a GitHub issue; a candidate that does not stays here as the
# record of a measurement, so nobody re-proposes it. Nothing in this file changes what
# stopslop reports: a rule is Rust in src/rules/, opened at Tier B, with fixtures.
#
# Candidate fields:
#   name        one line, what fires
#   kind        code | prose (which half of the corpus it is measured on)
#   langs       comma-separated corpus langs, or "code" / "prose" for every lang of that half
#   natlangs    comma-separated, omitted when the pattern carries no natural-language lexicon
#   scope       line             every line of the file
#               comment          comment lines only (markers stripped, string literals blanked)
#               file-first-line  the first three lines, for a paste artifact at the head
#               last-block       the last non-blank paragraph, for a closing tell
#   ignorecase  true to compile with re.IGNORECASE
#   regex       Python re syntax, written as a TOML literal string so backslashes stay literal
#   relation    which existing rule this extends, or "new"
#   tier        the tier it would open at, were it implemented
#   notes       what the measurement showed and what it does not show
#
# A [[miss]] records a case an existing rule should have caught and did not.

# Facts about the corpora that bound what any candidate below can show. Sourced from each
# dataset's paper; the registry in bench/score_corpus.py carries the per-dataset subset.
paper_caveats = [
  "CodeMirage regenerates every AI file to match its paired human file's line count and size and filters to BLEU < 0.5, so length and size tells are suppressed by construction.",
  "DroidCollection collected its human class after coding assistants were common and says so; its mitigation dropped the 7% most model-uncertain human samples rather than verified mislabels.",
  "AIGCodeSet is single-domain competitive-programming Python, and two of its three AI scenarios are model patches of existing human code, so part of the AI class keeps human structure.",
  "CoDET-M4 stripped every comment and docstring from both classes, so no comment-based tell can be measured on it at all.",
  "HC3 is one ChatGPT snapshot from December 2022, and its answers were pasted out of the API payload: the literal backslash-n break is a pipeline artifact, not model style.",
  "MAGE normalized punctuation and removed line breaks before release, destroying paragraph, whitespace and markdown-structure signals in both splits.",
  "Ghostbuster generated each AI document from a prompt derived from the paired human document with a target length, so length is matched by construction.",
  "WETBench is Wikipedia-specific, its Portuguese data is sentence-level, and one automatically selected prompt per task generated the whole corpus.",
  "APT-Eval holds no plain-AI split: every AI-side file is human text after a stated degree of polish, the hardest case for any rule and the easiest to over-read.",
  "AIDev is agent pull-request prose with no paired human split; its baseline has to be the pinned pre-2020 documentation cells, which is a different genre.",
  "Whitespaces Don't Lie reports leading-space, blank-line and AST-depth features at ROC-AUC 0.995 but publishes no thresholds, no direction of effect and no provenance, and a formatter normalizes all three.",
  "Style as a Confound contains no AI text: professional editing moves detector scores in opposite directions across families, so rules built on sentence length or lexical diversity risk flagging edited non-native prose.",
  "RAID engineered its prompts over several rounds to remove meta-commentary and filtered failed generations, so raw-output tells are absent from it by design.",
  "The dataset-quality survey (arXiv 2410.14677) argues near-perfect F1 on a benchmark usually signals a weak dataset rather than a strong detector.",
  "Rosetta Code's Python split is about nine tenths Python 2, so any parse-validity signal has nothing to separate there.",
]

# Tells measured and rejected before they reached a candidate row. Keeping them is the whole
# point of the file: each line is a measurement somebody would otherwise redo.
dropped = [
  "Narrowing SLOP042's Go file-scope exemption to exported identifiers: the proxy fires on 41.6% of pinned human Go files, more than on any AI cell.",
  "Parse-invalid source file as a rule on its own: human Python 2 and fragment files dominate the hits; only the adversarial split separates, which the ERROR-node candidate covers more narrowly.",
  "Python docstring that only restates the def name: PEP 257 one-line summaries are the taught style and the human rate is higher than the AI rate.",
  "Go qualified call to an unimported stdlib package: fires on human fragment files; SLOP010 territory.",
  "Paragraph-initial transition cascade: SLOP016 already owns Furthermore/Moreover/Additionally, and the Portuguese equivalents do not separate from student essays.",
  "Portuguese standalone vague quantifiers: already measured and rejected in weak_verb.rs.",
  "The pt-BR adjective crucial: SLOP016's English panel owns the token, and cross-language disjointness forbids re-flagging it.",
  "Assumption and simplicity hedges in code comments (assuming, for simplicity): human and AI rates overlap, and the crate's own ponytail convention documents the same idea.",
  "Meta-rationale comments (for clarity, Redundant check): they appear only in paraphrased AI cells, so they mark the paraphrase pipeline, not generation.",
  "Placeholder identifiers such as YourClass: one file, and the identifier proxy fires on human test helpers.",
  "Section-banner comments: SLOP042 exempts banners by design and the shape is a routine human habit.",
  "Paraphrastic restatement as a SLOP042 synonym table: an unbounded table, and not mechanically closed.",
  "Log-only Node error-first callback: idiomatic Node, and SLOP005 is catch-scoped on purpose.",
  "Demo-only main() scaffolding, single-method wrapper classes, enterprise role-suffix naming, exhaustive guard clauses, Google-style docstring sections: each one or two files, none mechanically closed.",
  "Cross-document verbatim lede reuse: a Rule never sees a second file; this belongs in the bench pipeline, not in a rule.",
  "Zero-width space and homoglyph perturbations: evasion attacks with no corpus evidence here, and security-linter territory.",
  "Statistical features from the papers (whitespace averages, AST depth, TTR, readability indices, perplexity, Self-BLEU): each needs a model or a corpus-calibrated threshold the papers do not publish.",
]

[[candidate]]
name = "Narrated stand-in comment: the code says it is a placeholder, a simulation or a demo"
kind = "code"
langs = "code"
natlangs = "en"
scope = "comment"
ignorecase = true
regex = '''(would go \bhere\b|(logic|code|implementation) goes \bhere\b|replace with (real|actual|your) |in a real(-world)? (scenario|application|world|system)|for demonstration( purposes)?|simulated? (data|response|delay|the (data|response|process))|for illustration|(this is a )?placeholder (for the (actual|real)|implementation|function|\blogic\b)|implement (the|this|your) \w+( \w+){0,4} (\blogic\b|\bhere\b)|your (code|\blogic\b|implementation) \bhere\b)'''
relation = "new; SLOP008 flags only empty or todo!() bodies, SLOP009 reads string literals, SLOP013 is prose-only"
tier = "B"
notes = """A human leaves a terse marker (TODO, unimplemented!); a model narrates its own
incompleteness in a sentence and repeats it across sibling methods. The word boundaries around
bare here and logic are load-bearing: without them the pattern matches inside thereby and
logician."""

[[candidate]]
name = "Example usage demo block comment"
